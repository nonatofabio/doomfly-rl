<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- doomfly-rl icon: a fruit fly as a Doom space marine. Original artwork, flat vector. -->
  <defs>
    <pattern id="facets" width="18" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="9" cy="8" r="5.2" fill="#7f1712"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="#17181c"/>

  <!-- wings, behind everything -->
  <g fill="#cfd8e3" fill-opacity="0.55" stroke="#9fb0c2" stroke-opacity="0.7" stroke-width="4">
    <ellipse cx="128" cy="262" rx="58" ry="118" transform="rotate(28 128 262)"/>
    <ellipse cx="384" cy="262" rx="58" ry="118" transform="rotate(-28 384 262)"/>
  </g>
  <g fill="none" stroke="#9fb0c2" stroke-opacity="0.6" stroke-width="3">
    <path d="M150 170 L112 360 M150 170 L96 330 M150 170 L134 372"/>
    <path d="M362 170 L400 360 M362 170 L416 330 M362 170 L378 372"/>
  </g>

  <!-- shoulder pads -->
  <g fill="#3d7a37" stroke="#1f4a1d" stroke-width="6" stroke-linejoin="round">
    <path d="M52 512 V372 q0 -60 62 -60 h40 v200 z"/>
    <path d="M460 512 V372 q0 -60 -62 -60 h-40 v200 z"/>
  </g>
  <g fill="#5ca24e">
    <path d="M78 512 V388 q0 -40 44 -40 h18 v164 z"/>
    <path d="M434 512 V388 q0 -40 -44 -40 h-18 v164 z"/>
  </g>

  <!-- chest plate -->
  <path d="M150 512 V340 q0 -34 34 -34 h144 q34 0 34 34 v172 z" fill="#3d7a37" stroke="#1f4a1d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M176 512 V352 q0 -22 22 -22 h116 q22 0 22 22 v160 z" fill="#4c9142"/>
  <path d="M256 330 V512" stroke="#2b5a28" stroke-width="8"/>
  <rect x="204" y="400" width="104" height="16" rx="4" fill="#2b5a28"/>
  <rect x="204" y="440" width="104" height="16" rx="4" fill="#2b5a28"/>
  <!-- collar -->
  <path d="M184 306 q72 -40 144 0 v26 q-72 -30 -144 0 z" fill="#2b5a28"/>

  <!-- neck -->
  <rect x="226" y="262" width="60" height="60" rx="14" fill="#a86a38"/>

  <!-- head -->
  <path d="M256 82 c78 0 130 52 130 128 c0 56 -60 100 -130 100 c-70 0 -130 -44 -130 -100 c0 -76 52 -128 130 -128 z" fill="#c98a4b" stroke="#6e4322" stroke-width="6"/>
  <!-- head bristles -->
  <g stroke="#6e4322" stroke-width="4" stroke-linecap="round">
    <path d="M214 108 l-10 -22 M256 96 l0 -24 M298 108 l10 -22"/>
  </g>

  <!-- antennae -->
  <g fill="none" stroke="#6e4322" stroke-width="7" stroke-linecap="round">
    <path d="M232 150 q-6 -30 -30 -36"/>
    <path d="M280 150 q6 -30 30 -36"/>
  </g>
  <g fill="none" stroke="#6e4322" stroke-width="3" stroke-linecap="round">
    <path d="M202 114 l-8 -14 M202 114 l-14 -6 M202 114 l2 -16"/>
    <path d="M310 114 l8 -14 M310 114 l14 -6 M310 114 l-2 -16"/>
  </g>
  <circle cx="202" cy="114" r="7" fill="#6e4322"/>
  <circle cx="310" cy="114" r="7" fill="#6e4322"/>

  <!-- compound eyes -->
  <g stroke="#5a0f0b" stroke-width="6">
    <ellipse cx="188" cy="196" rx="54" ry="66" fill="#c8322b"/>
    <ellipse cx="324" cy="196" rx="54" ry="66" fill="#c8322b"/>
  </g>
  <g>
    <ellipse cx="188" cy="196" rx="50" ry="62" fill="url(#facets)"/>
    <ellipse cx="324" cy="196" rx="50" ry="62" fill="url(#facets)"/>
  </g>
  <!-- eye highlights -->
  <g fill="#ffb3a7" fill-opacity="0.9">
    <ellipse cx="168" cy="160" rx="12" ry="18" transform="rotate(-20 168 160)"/>
    <ellipse cx="304" cy="160" rx="12" ry="18" transform="rotate(-20 304 160)"/>
  </g>

  <!-- brow ridge: the Doom guy scowl -->
  <path d="M136 140 q52 -14 100 12" fill="none" stroke="#6e4322" stroke-width="10" stroke-linecap="round"/>
  <path d="M376 140 q-52 -14 -100 12" fill="none" stroke="#6e4322" stroke-width="10" stroke-linecap="round"/>

  <!-- proboscis -->
  <path d="M244 262 q12 26 24 0" fill="none" stroke="#6e4322" stroke-width="8" stroke-linecap="round"/>
  <rect x="246" y="240" width="20" height="26" rx="8" fill="#6e4322"/>
</svg>
