[project]
name = "doomfly"
version = "0.1.0"
description = "The FlyWire fruit-fly connectome, trained to play Doom (a ChessFly analogue)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "torch>=2.2",
    "safetensors>=0.4",
    "vizdoom>=1.2.3",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "imageio>=2.34",
    "tqdm>=4.66",
    "boto3>=1.34",
    "requests>=2.31",
    "tensorboard>=2.16",
]

[project.optional-dependencies]
infra = ["aws-cdk-lib>=2.150", "constructs>=10.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doomfly"]
